<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blue3dDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5fe3ff"/>
      <stop offset="30%" stop-color="#35B6DE"/>
      <stop offset="85%" stop-color="#1495c2"/>
      <stop offset="100%" stop-color="#0e6b8c"/>
    </linearGradient>
    <linearGradient id="silver3dDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="goldYellowDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffb54"/>
      <stop offset="50%" stop-color="#F3ED1A"/>
      <stop offset="100%" stop-color="#d4cc08"/>
    </linearGradient>
    <linearGradient id="clockRingDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35B6DE"/>
      <stop offset="50%" stop-color="#67e0ff"/>
      <stop offset="100%" stop-color="#1582a6"/>
    </linearGradient>
    <filter id="glowShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- LEFT GRAPHIC: Speed Lines, Speed Clock, White Luxury Car & Chauffeur -->
  <g id="left-symbol" transform="translate(10, 15)">
    <!-- Speed streaks trailing left -->
    <path d="M 120 70 L 10 78 L 120 86 Z" fill="#35B6DE" opacity="0.95"/>
    <path d="M 130 95 L 0 108 L 130 118 Z" fill="#F3ED1A" opacity="0.98"/>
    <path d="M 140 128 L 25 138 L 140 146 Z" fill="#35B6DE" opacity="0.95"/>
    <path d="M 150 155 L 45 162 L 150 168 Z" fill="#F3ED1A" opacity="0.9"/>
    <path d="M 160 176 L 70 182 L 160 188 Z" fill="#35B6DE" opacity="0.85"/>

    <!-- Clock Outer Dial Gauge -->
    <g transform="translate(240, 125)">
      <!-- Outer thick cyan/blue ring with 3D bevel -->
      <circle cx="0" cy="0" r="105" stroke="url(#clockRingDark)" stroke-width="18" fill="#ffffff" filter="url(#glowShadow)"/>
      <circle cx="0" cy="0" r="94" stroke="#cbd5e1" stroke-width="2" fill="none"/>
      <!-- Clock tick marks -->
      <line x1="0" y1="-92" x2="0" y2="-78" stroke="#35B6DE" stroke-width="4" stroke-linecap="round"/>
      <line x1="65" y1="-65" x2="55" y2="-55" stroke="#35B6DE" stroke-width="4" stroke-linecap="round"/>
      <line x1="92" y1="0" x2="78" y2="0" stroke="#35B6DE" stroke-width="4" stroke-linecap="round"/>
      <line x1="65" y1="65" x2="55" y2="55" stroke="#35B6DE" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="92" x2="0" y2="78" stroke="#35B6DE" stroke-width="4" stroke-linecap="round"/>
      <line x1="-65" y1="65" x2="-55" y2="55" stroke="#35B6DE" stroke-width="4" stroke-linecap="round"/>
      <line x1="-92" y1="0" x2="-78" y2="0" stroke="#35B6DE" stroke-width="4" stroke-linecap="round"/>
      <line x1="-65" y1="-65" x2="-55" y2="-55" stroke="#35B6DE" stroke-width="4" stroke-linecap="round"/>
      <!-- Dynamic Yellow Clock Hands -->
      <polygon points="-4,-2 -30,-48 0,-62 6,-54 4,-2" fill="url(#goldYellowDark)" stroke="#b89c00" stroke-width="1.5"/>
      <polygon points="2,-3 50,-52 68,-65 58,-40 3,-1" fill="url(#goldYellowDark)" stroke="#b89c00" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="10" fill="#35B6DE" stroke="#ffffff" stroke-width="3"/>
      <circle cx="0" cy="0" r="4" fill="#F3ED1A"/>
    </g>

    <!-- White Luxury Innova Crysta / Lexus Front & Chauffeur -->
    <g id="luxury-car" transform="translate(45, 95)">
      <ellipse cx="230" cy="148" rx="140" ry="10" fill="#000000" opacity="0.45"/>
      <path d="M 120 120 Q 140 70 170 55 Q 220 45 285 45 Q 320 65 345 85 L 355 125 Q 345 142 245 145 Q 140 145 120 120 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <path d="M 175 58 L 275 50 L 315 82 L 180 82 Z" fill="#0f172a" opacity="0.9"/>
      <path d="M 195 62 L 265 55 L 295 80 L 200 80 Z" fill="#38bdf8" opacity="0.5"/>
      <path d="M 170 56 L 285 46 L 330 84" stroke="#ffffff" stroke-width="4" fill="none"/>
      <path d="M 235 90 L 315 88 L 325 130 Q 280 140 235 136 Z" fill="#020617" stroke="#475569" stroke-width="1.5"/>
      <line x1="240" y1="98" x2="310" y2="97" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="242" y1="106" x2="313" y2="105" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="244" y1="114" x2="316" y2="113" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="246" y1="122" x2="318" y2="121" stroke="#cbd5e1" stroke-width="2"/>
      <ellipse cx="280" cy="98" rx="7" ry="5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <polygon points="200,90 235,90 232,104 208,102" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
      <polygon points="315,88 346,92 344,104 322,104" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M 190 120 L 235 134 L 328 132 L 352 118 L 348 138 Q 280 146 200 138 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="215" cy="128" r="5" fill="#facc15" stroke="#475569" stroke-width="1"/>
      <circle cx="340" cy="126" r="5" fill="#facc15" stroke="#475569" stroke-width="1"/>
      <ellipse cx="145" cy="132" rx="22" ry="24" fill="#020617"/>
      <ellipse cx="145" cy="132" rx="14" ry="16" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="145" cy="132" r="5" fill="#e2e8f0"/>
      <ellipse cx="330" cy="130" rx="18" ry="22" fill="#020617"/>
      <ellipse cx="330" cy="130" rx="11" ry="14" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>
    </g>

    <!-- Professional Chauffeur -->
    <g id="chauffeur" transform="translate(110, 50)">
      <ellipse cx="42" cy="192" rx="25" ry="6" fill="#000000" opacity="0.5"/>
      <path d="M 28 32 Q 42 22 56 32 L 62 36 Q 42 33 22 36 Z" fill="#020617"/>
      <path d="M 24 35 Q 42 31 60 35 L 64 38 Q 42 36 20 38 Z" fill="#facc15"/>
      <ellipse cx="42" cy="28" rx="16" ry="7" fill="#020617"/>
      <polygon points="34,36 50,36 48,50 36,50" fill="#fcd34d"/>
      <ellipse cx="42" cy="42" rx="7" ry="8" fill="#fde68a"/>
      <polygon points="36,49 48,49 44,60 40,60" fill="#ffffff"/>
      <polygon points="41,51 44,51 43,68 42,68" fill="#020617"/>
      <path d="M 20 54 L 38 50 L 46 50 L 64 54 L 68 112 L 54 114 L 43 78 L 32 114 L 16 112 Z" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      <path d="M 20 54 L 14 96 L 22 108 L 26 98 L 24 62 Z" fill="#090d16"/>
      <ellipse cx="22" cy="108" rx="5" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <path d="M 64 54 L 70 96 L 58 106 L 52 98 L 60 62 Z" fill="#090d16"/>
      <ellipse cx="56" cy="106" rx="5" ry="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <path d="M 24 113 L 39 113 L 40 178 L 31 178 Z" fill="#090d16"/>
      <path d="M 44 113 L 59 113 L 53 178 L 44 178 Z" fill="#090d16"/>
      <ellipse cx="35" cy="182" rx="9" ry="5" fill="#020617"/>
      <ellipse cx="49" cy="182" rx="9" ry="5" fill="#020617"/>
    </g>
  </g>

  <!-- RIGHT GRAPHIC: Typographic Logo & Badges (White Text Variant for Dark Backgrounds) -->
  <g id="right-typography" transform="translate(425, 20)">
    
    <!-- TOP LINE: "ON TIME" with Checkmark in O and Wings on E -->
    <g transform="translate(0, 115)">
      
      <!-- LETTER "O": Verification Seal Badge -->
      <g transform="translate(48, 0)" filter="url(#glowShadow)">
        <circle cx="0" cy="0" r="48" fill="url(#silver3dDark)" stroke="#64748b" stroke-width="3"/>
        <circle cx="0" cy="0" r="40" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        <circle cx="0" cy="0" r="32" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
        <path d="M -16 2 L -5 16 L 22 -14 L 14 -19 L -5 5 L -10 -2 Z" fill="url(#goldYellowDark)" stroke="#b89c00" stroke-width="1.5"/>
      </g>

      <!-- LETTER "N" (Silver 3D Block Letter) -->
      <g transform="translate(108, -48)" filter="url(#glowShadow)">
        <path d="M 0 96 L 0 0 L 26 0 L 62 62 L 62 0 L 84 0 L 84 96 L 58 96 L 22 34 L 22 96 Z" 
              fill="url(#silver3dDark)" stroke="#334155" stroke-width="2.5"/>
      </g>

      <!-- WORD "TIME" (Cyan Blue 3D Futuristic Bold Letters) -->
      <g transform="translate(210, -48)" filter="url(#glowShadow)">
        <path d="M 0 0 L 72 0 L 72 24 L 48 24 L 48 96 L 24 96 L 24 24 L 0 24 Z" 
              fill="url(#blue3dDark)" stroke="#094e66" stroke-width="2.5"/>
      </g>

      <g transform="translate(292, -48)" filter="url(#glowShadow)">
        <path d="M 0 0 L 24 0 L 24 96 L 0 96 Z" 
              fill="url(#blue3dDark)" stroke="#094e66" stroke-width="2.5"/>
      </g>

      <g transform="translate(328, -48)" filter="url(#glowShadow)">
        <path d="M 0 96 L 0 0 L 26 0 L 49 52 L 72 0 L 98 0 L 98 96 L 76 96 L 76 34 L 58 72 L 40 72 L 22 34 L 22 96 Z" 
              fill="url(#blue3dDark)" stroke="#094e66" stroke-width="2.5"/>
      </g>

      <g transform="translate(438, -48)" filter="url(#glowShadow)">
        <path d="M 0 0 L 64 0 L 64 22 L 24 22 L 24 37 L 58 37 L 58 58 L 24 58 L 24 74 L 66 74 L 66 96 L 0 96 Z" 
              fill="url(#blue3dDark)" stroke="#094e66" stroke-width="2.5"/>
        <path d="M 68 0 Q 110 -6 142 8 L 134 24 Q 102 14 68 20 Z" 
              fill="url(#goldYellowDark)" stroke="#b89c00" stroke-width="1.5"/>
        <path d="M 62 36 Q 96 32 126 44 L 118 58 Q 90 50 62 54 Z" 
              fill="url(#goldYellowDark)" stroke="#b89c00" stroke-width="1.5"/>
        <path d="M 70 72 Q 95 72 114 82 L 108 94 Q 88 88 70 88 Z" 
              fill="url(#goldYellowDark)" stroke="#b89c00" stroke-width="1.5"/>
      </g>
    </g>

    <!-- MIDDLE LINE: = DRIVER SERVICE = (Crisp White Text for Dark Background) -->
    <g transform="translate(10, 175)">
      <rect x="35" y="-14" width="46" height="7" rx="3" fill="#F3ED1A"/>
      <rect x="35" y="-2" width="46" height="7" rx="3" fill="#35B6DE"/>

      <text x="280" y="3" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
            font-size="34" 
            font-weight="900" 
            letter-spacing="5" 
            text-anchor="middle" 
            fill="#FFFFFF">
        DRIVER SERVICE
      </text>

      <rect x="475" y="-14" width="46" height="7" rx="3" fill="#F3ED1A"/>
      <rect x="475" y="-2" width="46" height="7" rx="3" fill="#35B6DE"/>
    </g>

    <!-- BOTTOM LINE: PREMIUM CHAUFFEURS NETWORK (Silver-White Text) -->
    <g transform="translate(10, 215)">
      <text x="280" y="0" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
            font-size="16" 
            font-weight="800" 
            letter-spacing="9" 
            text-anchor="middle" 
            fill="#E2E8F0">
        PREMIUM CHAUFFEURS NETWORK
      </text>
    </g>
  </g>
</svg>
