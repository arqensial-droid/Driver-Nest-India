<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="favClockRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35B6DE"/>
      <stop offset="100%" stop-color="#1582a6"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffb54"/>
      <stop offset="100%" stop-color="#F3ED1A"/>
    </linearGradient>
  </defs>

  <!-- Speed streaks -->
  <path d="M 40 25 L 8 30 L 40 35 Z" fill="#35B6DE"/>
  <path d="M 45 42 L 2 50 L 45 56 Z" fill="#F3ED1A"/>
  <path d="M 48 64 L 6 70 L 48 74 Z" fill="#35B6DE"/>

  <!-- Clock Outer Ring -->
  <circle cx="72" cy="64" r="50" stroke="url(#favClockRing)" stroke-width="9" fill="#ffffff"/>
  <circle cx="72" cy="64" r="42" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>

  <!-- Clock hands in yellow -->
  <line x1="72" y1="64" x2="48" y2="40" stroke="url(#favGold)" stroke-width="5" stroke-linecap="round"/>
  <line x1="72" y1="64" x2="98" y2="34" stroke="url(#favGold)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="72" cy="64" r="6" fill="#35B6DE"/>
  <circle cx="72" cy="64" r="2.5" fill="#F3ED1A"/>

  <!-- Verification Checkmark Shield overlay in bottom right -->
  <circle cx="94" cy="94" r="26" fill="#111827" stroke="#35B6DE" stroke-width="3"/>
  <path d="M 83 95 L 91 103 L 106 85" stroke="#F3ED1A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
